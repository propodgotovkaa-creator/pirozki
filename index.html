<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лепим пирожки</title>

<style>
* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  display: grid;
  place-items: center;
  background: #3a261a;
  font-family: "Trebuchet MS", Arial, sans-serif;
}

button {
  font: inherit;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

[hidden] { display: none !important; }

.stage {
  position: relative;
  width: min(100vw, 177.777778vh);
  aspect-ratio: 16 / 9;
  overflow: hidden;
  isolation: isolate;
  container-type: inline-size;
  user-select: none;
}

/* ---------- ОБЩЕЕ ---------- */

.scene-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
}

.hint {
  position: absolute;
  z-index: 30;
  top: 3%;
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  padding: .65em 1.25em;
  border: 1px solid #fff9eac7;
  border-radius: 100px;
  background: #fff8eaef;
  box-shadow: 0 4px 18px #66341520;
  color: #754521;
  font-size: clamp(12px, 1.7cqw, 28px);
  font-weight: 700;
  white-space: nowrap;
  transition: opacity .35s ease;
}

.restart {
  position: absolute;
  top: 3%;
  right: 2%;
  z-index: 31;
  width: 4.2%;
  aspect-ratio: 1;
  border: 1px solid #fff9eac7;
  border-radius: 50%;
  background: #fff8eaef;
  color: #754521;
  font-size: 3cqw;
  line-height: 1;
  cursor: pointer;
}

/* =========================================================
   СЦЕНА 1
========================================================= */

.kitchen-scene {
  position: absolute;
  inset: 0;
}

.tray {
  position: absolute;
  left: 67%;
  top: 25%;
  width: 31%;
  height: 27%;
  padding: 0;
  border: 0;
  background: none;
  z-index: 2;
}

.tray-image {
  position: absolute;
  width: 100%;
  height: auto;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
}

.tray:disabled { opacity: 1; }

.tray.ready {
  cursor: pointer;
}

.tray.ready .tray-image {
  animation: trayGlow 1.6s ease-in-out infinite;
}

.pastries {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.pastry {
  position: absolute;
  width: 26%;
  height: auto;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 2px #24110755);
}

.dough {
  position: absolute;
  z-index: 4;
  width: 23%;
  aspect-ratio: 1;
  padding: 0;
  border: 0;
  border-radius: 48%;
  background: none;
  transform: translate(-50%, -50%);
  cursor: pointer;
}

.dough-layer {
  position: absolute;
  width: 100%;
  height: 100%;
  left: 0;
  top: 0;
  object-fit: contain;
  pointer-events: none;
  filter: drop-shadow(0 7px 4px #80461935);
}

.dough .next { opacity: 0; }

.dough:not(:disabled) .current {
  animation: doughInvite 2.3s ease-in-out infinite;
}

/* =========================================================
   СЦЕНА 2 - ДУХОВКА
========================================================= */

.oven-scene {
  position: absolute;
  inset: 0;
  z-index: 10;
  overflow: hidden;
  background: #26140c;
}

/* Фон уже содержит корпус духовки и пустой проём */
.oven-background {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}

/*
  Весь противень со своими 6 пирожками.
  Позиции ниже можно будет очень легко подправить,
  если по твоему PNG духовки понадобится на несколько % выше/ниже.
*/
.oven-tray {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 69%;
  width: 45%;
  height: 27%;
  transform: translate(-50%, 75%);
  opacity: 0;
  pointer-events: none;
}

.oven-tray.visible {
  opacity: 1;
}

.oven-tray .tray-image {
  width: 100%;
}

.oven-tray .pastries {
  position: absolute;
  inset: 0;
}

/* дверца */
.oven-door-wrap {
  position: absolute;
  z-index: 9;

  left: 50%;
  top: 74%;

  width: 52%;
  height: 28%;

  transform:
    translate(-50%, -50%)
    perspective(900px)
    rotateX(0deg);

  transform-origin: 50% 100%;

  transition:
    transform 900ms cubic-bezier(.35,.05,.18,1),
    opacity .3s ease;

  pointer-events: none;
}

/* закрытая наружная сторона */
.oven-door-front,
.oven-door-inner {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}

.oven-door-inner {
  opacity: 0;
}

/* открытая дверца ложится вперёд */
.oven-door-wrap.open {
  transform:
    translate(-50%, -50%)
    perspective(900px)
    rotateX(68deg);
}

.oven-door-wrap.open .oven-door-front {
  opacity: 0;
}

.oven-door-wrap.open .oven-door-inner {
  opacity: 1;
}

/* тёплое свечение во время выпечки */
.oven-glow {
  position: absolute;
  z-index: 3;
  left: 30%;
  top: 28%;
  width: 40%;
  height: 40%;
  border-radius: 30%;
  background:
    radial-gradient(
      ellipse at center,
      rgba(255,183,63,.48),
      rgba(255,111,22,.15) 48%,
      transparent 72%
    );
  opacity: 0;
  pointer-events: none;
}

.oven-glow.baking {
  animation: bakingGlow 1.15s ease-in-out infinite;
}

/* затемнение при переходе */
.transition-cover {
  position: absolute;
  inset: 0;
  z-index: 50;
  background: #2b160b;
  opacity: 0;
  pointer-events: none;
}

/* =========================================================
   ФИНАЛ
========================================================= */

.finish {
  position: absolute;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  background: #3e210f38;
  backdrop-filter: blur(3px);
}

.finish-card {
  width: 40%;
  padding: 2.4% 3% 3%;
  border: 2px solid #fffefa;
  border-radius: 2.5cqw;
  background: #fff6e5;
  box-shadow: 0 16px 50px #59301833;
  color: #754521;
  text-align: center;
}

.finish-flower {
  display: block;
  color: #e9a244;
  font-size: 5cqw;
  line-height: 1;
}

.finish h1 {
  margin: .4em 0;
  font-size: 2.6cqw;
}

.finish p {
  margin: .6em 0 1.5em;
  font-size: 1.6cqw;
}

.again {
  border: 0;
  border-radius: 50px;
  background: #bc6430;
  color: white;
  padding: .8em 1.9em;
  font-size: 1.7cqw;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 0 #8f4521;
}

@keyframes trayGlow {
  0%,100% {
    filter: drop-shadow(0 0 3px #fff7aa);
  }
  50% {
    filter: drop-shadow(0 0 14px #fff0a0);
  }
}

@keyframes doughInvite {
  0%,75%,100% {
    filter: drop-shadow(0 7px 4px #80461935);
  }
  86% {
    filter:
      drop-shadow(0 7px 4px #80461935)
      brightness(1.08);
  }
}

@keyframes bakingGlow {
  0%,100% { opacity: .35; }
  50% { opacity: .8; }
}

</style>
</head>

<body>

<main class="stage">

  <!-- ================= СЦЕНА 1 ================= -->

  <section class="kitchen-scene">

    <img
      class="scene-bg"
      src="fon.png"
      alt=""
      draggable="false"
    >

    <button class="tray" type="button" disabled>

      <img
        class="tray-image"
        src="tray-empty.png"
        alt=""
        draggable="false"
      >

      <span class="pastries"></span>

    </button>

    <button
      class="dough"
      type="button"
      disabled
      hidden
    >
      <img
        class="dough-layer current"
        src="dough-1.png"
        alt=""
      >

      <img
        class="dough-layer next"
        src="dough-1.png"
        alt=""
      >
    </button>

  </section>


  <!-- ================= СЦЕНА 2 ================= -->

  <section class="oven-scene" hidden>

    <img
      class="oven-background"
      src="oven-background.png"
      alt=""
      draggable="false"
    >

    <div class="oven-glow"></div>

    <div class="oven-tray">

      <img
        class="tray-image"
        src="tray-empty.png"
        alt=""
      >

      <span class="pastries oven-pastries"></span>

    </div>

    <div class="oven-door-wrap open">

      <img
        class="oven-door-front"
        src="oven-door-front.png"
        alt=""
      >

      <img
        class="oven-door-inner"
        src="oven-door-inner.png"
        alt=""
      >

    </div>

  </section>


  <p class="hint">
    Готовим кухню…
  </p>

  <button
    class="restart"
    type="button"
    aria-label="Начать сначала"
  >
    ↻
  </button>

  <div class="transition-cover"></div>


  <!-- ================= ФИНАЛ ================= -->

  <section class="finish" hidden>

    <div class="finish-card">

      <span class="finish-flower">✿</span>

      <h1>Пирожки готовы!</h1>

      <p>
        Какие румяные получились!
      </p>

      <button class="again" type="button">
        Ещё раз
      </button>

    </div>

  </section>

</main>


<script>

(() => {

'use strict';

/* ---------------------------------------------------------
   ЭЛЕМЕНТЫ
--------------------------------------------------------- */

const stage = document.querySelector('.stage');

const kitchenScene =
  document.querySelector('.kitchen-scene');

const ovenScene =
  document.querySelector('.oven-scene');

const dough =
  document.querySelector('.dough');

const current =
  dough.querySelector('.current');

const next =
  dough.querySelector('.next');

const tray =
  document.querySelector('.tray');

const pastries =
  tray.querySelector('.pastries');

const ovenTray =
  document.querySelector('.oven-tray');

const ovenPastries =
  document.querySelector('.oven-pastries');

const door =
  document.querySelector('.oven-door-wrap');

const glow =
  document.querySelector('.oven-glow');

const hint =
  document.querySelector('.hint');

const finish =
  document.querySelector('.finish');

const again =
  document.querySelector('.again');

const restart =
  document.querySelector('.restart');

const cover =
  document.querySelector('.transition-cover');


/* ---------------------------------------------------------
   НАСТРОЙКИ
--------------------------------------------------------- */

const hands = [
  { x: 28.7, y: 68 },
  { x: 65.3, y: 68 }
];

const slots = [
  { x: 27, y: 42 },
  { x: 50, y: 42 },
  { x: 73, y: 42 },

  { x: 27, y: 61 },
  { x: 50, y: 61 },
  { x: 73, y: 61 }
];

let phase = 'loading';

let frame = 1;

let hand = 0;

let count = 0;

let position = hands[0];

let run = 0;


/* ---------------------------------------------------------
   ВСПОМОГАТЕЛЬНЫЕ
--------------------------------------------------------- */

const wait = ms =>
  new Promise(resolve => setTimeout(resolve, ms));

const src = n => `dough-${n}.png`;

function setPhase(value) {
  phase = value;
}

function place(point) {

  position = point;

  dough.style.left = `${point.x}%`;
  dough.style.top = `${point.y}%`;

}

function animateElement(
  element,
  keyframes,
  duration,
  easing = 'ease-in-out'
) {

  const animation =
    element.animate(
      keyframes,
      {
        duration,
        easing,
        fill: 'forwards'
      }
    );

  return animation.finished.catch(() => {});

}


/* ---------------------------------------------------------
   НОВЫЙ КУСОК ТЕСТА
--------------------------------------------------------- */

function showFirstDough() {

  frame = 1;
  hand = 0;

  current.src = src(1);
  next.src = src(1);

  current.style.opacity = 1;
  next.style.opacity = 0;

  dough.style.width = '23%';
  dough.style.opacity = 1;

  dough.hidden = false;
  dough.disabled = false;

  place(hands[0]);

  setPhase('shaping');

  hint.textContent =
    count === 0
      ? 'Нажимай на тесто'
      : 'Лепим следующий пирожок';

}


/* ---------------------------------------------------------
   ПЕРЕЛЁТ МЕЖДУ РУКАМИ
--------------------------------------------------------- */

async function shape() {

  if (
    phase !== 'shaping' ||
    dough.disabled
  ) return;

  const token = run;

  setPhase('flying');

  dough.disabled = true;

  const from = position;

  const target =
    hands[1 - hand];

  next.src =
    src(frame + 1);

  next.style.opacity = 0;

  const move =
    animateElement(
      dough,
      [
        {
          left: `${from.x}%`,
          top: `${from.y}%`
        },

        {
          left:
            `${(from.x + target.x) / 2}%`,
          top:
            `${Math.min(from.y,target.y)-20}%`
        },

        {
          left: `${target.x}%`,
          top: `${target.y}%`
        }
      ],
      780
    );

  const fadeOld =
    animateElement(
      current,
      [
        { opacity: 1 },
        { opacity: 0 }
      ],
      650
    );

  const fadeNew =
    animateElement(
      next,
      [
        { opacity: 0 },
        { opacity: 1 }
      ],
      650
    );

  await Promise.all([
    move,
    fadeOld,
    fadeNew
  ]);

  if (token !== run) return;

  hand = 1 - hand;

  frame++;

  place(target);

  current.src = src(frame);
  current.style.opacity = 1;

  next.style.opacity = 0;

  if (frame === 5) {

    await wait(300);

    moveToTray(token);

  }

  else {

    setPhase('shaping');

    dough.disabled = false;

  }

}


/* ---------------------------------------------------------
   ПИРОЖОК ЛЕТИТ НА ПРОТИВЕНЬ
--------------------------------------------------------- */

async function moveToTray(token) {

  setPhase('placing');

  const slot =
    slots[count];

  const bounds =
    stage.getBoundingClientRect();

  const trayBounds =
    tray.getBoundingClientRect();

  const target = {

    x:
      (
        trayBounds.left -
        bounds.left +
        trayBounds.width *
        slot.x / 100
      )
      /
      bounds.width * 100,

    y:
      (
        trayBounds.top -
        bounds.top +
        trayBounds.height *
        slot.y / 100
      )
      /
      bounds.height * 100
  };

  const smallWidth =
    trayBounds.width *
    .26 /
    bounds.width *
    100;

  await animateElement(
    dough,
    [
      {
        left: `${position.x}%`,
        top: `${position.y}%`,
        width: '23%'
      },

      {
        left:
          `${(position.x + target.x)/2}%`,
        top:
          `${Math.min(position.y,target.y)-12}%`,
        width: '15%'
      },

      {
        left: `${target.x}%`,
        top: `${target.y}%`,
        width: `${smallWidth}%`
      }
    ],
    950
  );

  if (token !== run) return;

  const pastry =
    new Image();

  pastry.src =
    'dough-5.png';

  pastry.className =
    'pastry';

  pastry.style.left =
    `${slot.x}%`;

  pastry.style.top =
    `${slot.y}%`;

  pastries.append(pastry);

  count++;

  dough.hidden = true;

  if (count === 6) {

    setPhase('tray-ready');

    tray.disabled = false;

    tray.classList.add('ready');

    hint.textContent =
      'Нажми на противень';

  }

  else {

    showFirstDough();

  }

}


/* ---------------------------------------------------------
   ПЕРЕХОД К ДУХОВКЕ
--------------------------------------------------------- */

async function startOven() {

  if (phase !== 'tray-ready')
    return;

  setPhase('oven-transition');

  tray.disabled = true;

  tray.classList.remove('ready');

  dough.hidden = true;

  hint.textContent =
    'Отправляем пирожки в духовку';

  /*
    Затемнение
  */

  await animateElement(
    cover,
    [
      { opacity: 0 },
      { opacity: 1 }
    ],
    500
  );

  /*
    Меняем сцену
  */

  kitchenScene.hidden = true;

  ovenScene.hidden = false;

  /*
    Копируем 6 пирожков
    на противень духовки
  */

  ovenPastries.replaceChildren();

  slots.forEach(slot => {

    const pastry =
      new Image();

    pastry.src =
      'dough-5.png';

    pastry.className =
      'pastry';

    pastry.style.left =
      `${slot.x}%`;

    pastry.style.top =
      `${slot.y}%`;

    ovenPastries.append(pastry);

  });

  /*
    духовка изначально открыта
  */

  door.classList.add('open');

  ovenTray.classList.add('visible');

  ovenTray.style.transform =
    'translate(-50%, 75%)';

  await animateElement(
    cover,
    [
      { opacity: 1 },
      { opacity: 0 }
    ],
    550
  );

  await wait(350);

  /*
    Противень заезжает
  */

  hint.textContent =
    'Ставим пирожки в духовку';

  await animateElement(
    ovenTray,
    [
      {
        transform:
          'translate(-50%, 75%) scale(1)'
      },

      {
        transform:
          'translate(-50%, 5%) scale(.78)'
      }
    ],
    1300,
    'cubic-bezier(.3,.05,.2,1)'
  );

  await wait(250);

  /*
    Закрываем дверцу
  */

  hint.textContent =
    'Пирожки пекутся…';

  door.classList.remove('open');

  await wait(1000);

  /*
    Выпекание
  */

  glow.classList.add('baking');

  await wait(4000);

  glow.classList.remove('baking');

  /*
    Заменяем сырые пирожки
    румяными
  */

  ovenPastries
    .querySelectorAll('.pastry')
    .forEach(img => {

      img.src =
        'pie-baked.png';

    });

  /*
    Открываем духовку
  */

  hint.textContent =
    'Готово!';

  door.classList.add('open');

  await wait(1000);

  /*
    Выдвигаем противень
  */

  await animateElement(
    ovenTray,
    [
      {
        transform:
          'translate(-50%, 5%) scale(.78)'
      },

      {
        transform:
          'translate(-50%, 70%) scale(1)'
      }
    ],
    1400,
    'cubic-bezier(.2,.7,.2,1)'
  );

  await wait(600);

  /*
    Финал
  */

  setPhase('complete');

  hint.textContent =
    'Пирожки готовы!';

  finish.hidden = false;

}


/* ---------------------------------------------------------
   RESET
--------------------------------------------------------- */

function reset() {

  run++;

  count = 0;

  frame = 1;

  hand = 0;

  setPhase('resetting');

  kitchenScene.hidden = false;

  ovenScene.hidden = true;

  finish.hidden = true;

  pastries.replaceChildren();

  ovenPastries.replaceChildren();

  tray.disabled = true;

  tray.classList.remove('ready');

  door.classList.add('open');

  glow.classList.remove('baking');

  ovenTray.classList.remove('visible');

  ovenTray.style.transform =
    'translate(-50%, 75%)';

  cover.style.opacity = 0;

  showFirstDough();

}


/* ---------------------------------------------------------
   ЗАГРУЗКА
--------------------------------------------------------- */

async function preload() {

  const files = [

    'fon.png',

    'tray-empty.png',

    'dough-1.png',
    'dough-2.png',
    'dough-3.png',
    'dough-4.png',
    'dough-5.png',

    'oven-background.png',
    'oven-door-front.png',
    'oven-door-inner.png',

    'pie-baked.png'

  ];

  await Promise.all(

    files.map(file =>

      new Promise(resolve => {

        const img =
          new Image();

        img.onload = resolve;

        img.onerror = resolve;

        img.src = file;

      })

    )

  );

}


/* ---------------------------------------------------------
   СОБЫТИЯ
--------------------------------------------------------- */

dough.addEventListener(
  'click',
  shape
);

tray.addEventListener(
  'click',
  startOven
);

restart.addEventListener(
  'click',
  reset
);

again.addEventListener(
  'click',
  reset
);


/* ---------------------------------------------------------
   START
--------------------------------------------------------- */

(async () => {

  hint.textContent =
    'Готовим кухню…';

  await preload();

  reset();

})();

})();

</script>

</body>
</html>
