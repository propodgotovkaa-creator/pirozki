  <style>
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body { display: grid; place-items: center; background: #3a261a; font-family: "Trebuchet MS", Arial, sans-serif; }
button { font: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus-visible { outline: 3px solid #fff8dc; outline-offset: 4px; }
[hidden] { display: none !important; }
.stage { position: relative; width: min(100vw, 177.777778vh); aspect-ratio: 16 / 9; overflow: hidden; isolation: isolate; container-type: inline-size; user-select: none; }
.kitchen { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.hint { position: absolute; z-index: 5; top: 3%; left: 50%; transform: translateX(-50%); margin: 0; padding: .65em 1.25em; border: 1px solid #fff9eac7; border-radius: 100px; background: #fff8eaeF; box-shadow: 0 4px 18px #66341520; color: #754521; font-size: clamp(12px, 1.7cqw, 28px); font-weight: 700; white-space: nowrap; }
.restart { position: absolute; top: 3%; right: 2%; z-index: 6; width: 4.2%; aspect-ratio: 1; border: 1px solid #fff9eac7; border-radius: 50%; background: #fff8eaeF; color: #754521; font-size: 3cqw; line-height: 1; cursor: pointer; }
.restart:disabled { opacity: .5; cursor: default; }
.tray { position: absolute; left: 67%; top: 25%; width: 31%; height: 27%; padding: 0; border: 0; background: none; z-index: 2; }
.tray-image { position: absolute; width: 100%; height: auto; left: 0; top: 50%; transform: translateY(-50%); pointer-events: none; }
.tray:disabled { opacity: 1; }
.tray.ready { cursor: pointer; }
.tray.ready .tray-image { animation: tray-glow 1.6s ease-in-out infinite; }
.pastries { position: absolute; inset: 0; pointer-events: none; }
.pastry { position: absolute; width: 26%; height: auto; transform: translate(-50%, -50%); filter: drop-shadow(0 3px 2px #24110755); }
.dough { position: absolute; z-index: 4; width: 23%; aspect-ratio: 1; padding: 0; border: 0; border-radius: 48%; background: none; transform: translate(-50%, -50%); cursor: pointer; touch-action: manipulation; }
.dough:disabled { cursor: default; }
.dough-layer { position: absolute; width: 100%; height: 100%; left: 0; top: 0; pointer-events: none; filter: drop-shadow(0 7px 4px #80461935); }
.dough .next { opacity: 0; }
.dough:not(:disabled) .current { animation: dough-invite 2.3s ease-in-out infinite; }
.finish, .error { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; background: #3e210f38; backdrop-filter: blur(3px); }
.finish-card, .error { color: #754521; text-align: center; }
.finish-card { width: 40%; padding: 2.4% 3% 3%; border: 2px solid #fffefa; border-radius: 2.5cqw; background: #fff6e5; box-shadow: 0 16px 50px #59301833; }
.finish-flower { display: block; color: #e9a244; font-size: 5cqw; line-height: 1; }
h1 { margin: .4em 0; font-size: 2.6cqw; }
.finish-card p { margin: .6em 0 1.5em; font-size: 1.6cqw; }
.again, .retry { border: 0; border-radius: 50px; background: #bc6430; color: #fff; padding: .8em 1.9em; font-size: 1.7cqw; font-weight: 700; cursor: pointer; box-shadow: 0 4px 0 #8f4521; }
.again:hover, .retry:hover { background: #a95125; }
.error { align-content: center; gap: 1em; background: #fff3dfee; font-size: 2cqw; }
.retry { justify-self: center; }
@keyframes tray-glow { 0%, 100% { filter: drop-shadow(0 0 3px #fff7aa); } 50% { filter: drop-shadow(0 0 14px #fff0a0); } }
@keyframes dough-invite { 0%, 75%, 100% { filter: drop-shadow(0 7px 4px #80461935); } 86% { filter: drop-shadow(0 7px 4px #80461935) brightness(1.08); } }
@media (prefers-reduced-motion: reduce) { .tray.ready .tray-image, .dough:not(:disabled) .current { animation: none; } }


.oven-scene{position:absolute;inset:0;z-index:7;overflow:hidden;background:#3a261a}
.oven-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.oven-tray{position:absolute;z-index:8;left:50%;top:74%;width:35%;height:25%;transform:translate(-50%,-50%);opacity:0;pointer-events:none}
.oven-tray .tray-image{position:absolute;width:100%;height:auto;left:0;top:50%;transform:translateY(-50%)}
.oven-tray .pastries{position:absolute;inset:0}
/* Both door pictures keep their drawn perspective. */
.oven-door{position:absolute;inset:0;z-index:9;pointer-events:none}
.oven-door.open{z-index:7}
.oven-door img{position:absolute;left:50%;object-fit:fill;transition:opacity .9s ease-in-out,transform .9s ease-in-out}
.oven-door .door-front{top:30%;width:48%;height:45%;opacity:1;transform:translateX(-50%)}
.oven-door .door-inner{top:69%;width:46%;height:26%;opacity:0;transform:translate(-50%,-2%)}
.oven-door.open .door-front{opacity:0;transform:translate(-50%,2%)}
.oven-door.open .door-inner{opacity:1;transform:translateX(-50%)}
.oven-glow{position:absolute;z-index:10;left:34%;top:42%;width:32%;height:25%;border-radius:35%;background:radial-gradient(ellipse at center,rgba(255,190,70,.35),rgba(255,115,20,.1) 50%,transparent 72%);opacity:0;pointer-events:none}
.oven-glow.baking{animation:oven-bake 1.1s ease-in-out infinite}
.stage:has(.oven-scene:not([hidden])) > .hint,.stage:has(.oven-scene:not([hidden])) > .restart{z-index:8}
/* Leave the six baked pies visible below the final message. */
.stage:has(.oven-scene:not([hidden])) > .finish{align-items:start;padding-top:7%;background:transparent;backdrop-filter:none}
@keyframes oven-bake{0%,100%{opacity:.28}50%{opacity:.78}}
@media(prefers-reduced-motion:reduce){.oven-door img{transition-duration:.16s}.oven-glow.baking{animation:none;opacity:.5}}

.hint,.finish-card,.error,.again,.retry{font-family:'Ruslan Display',Georgia,serif;font-weight:400}
.hint,.finish-card{
 color:#71391f;border:1px solid #a97137;border-radius:1.2cqw;
 background:radial-gradient(ellipse at 50% 0%,#fff8ddc9,transparent 68%),repeating-linear-gradient(3deg,#a7722905 0 1px,transparent 1px 4px),linear-gradient(100deg,#e7bf7e,#f9e7bd 17%,#fff0cf 50%,#f9e7bd 83%,#e7bf7e);
 box-shadow:inset 0 0 0 .25cqw #f9e8c4,inset 0 0 0 .34cqw #ac78428c,0 .35cqw .8cqw #4d271b38;
 text-shadow:0 1px #fff7df;
}
.hint{top:2.5%;max-width:83%;width:max-content;padding:.65em 2em .6em;font-size:clamp(12px,2.05cqw,30px);line-height:1.25;letter-spacing:.025em;white-space:normal;text-align:center;text-wrap:balance}
.hint::before,.hint::after{content:'✦';position:absolute;top:50%;transform:translateY(-50%);font-family:Georgia,serif;color:#a04f2b;font-size:1em;text-shadow:0 1px #fff4ce}
.hint::before{left:.65em}.hint::after{right:.65em}
.finish-card{position:relative;border-radius:1.5cqw}
.finish-card h1{font-weight:400;line-height:1.2}
.finish-card p{font-size:1.75cqw;line-height:1.35}
.finish-flower{color:#a45f2e}
.again,.retry{border:1px solid #80401e;border-radius:.65cqw;background:linear-gradient(#b36536,#964523);box-shadow:inset 0 0 0 2px #e7ae684d,0 3px 0 #743719;font-weight:400;letter-spacing:.035em}
.again:hover,.retry:hover{background:linear-gradient(#bd7241,#a05329)}


/* Compact, softly framed instruction card. */
.hint{max-width:49%;padding:.55em 1.15em .6em;font-size:clamp(12px,2.05cqw,30px);line-height:1.35;letter-spacing:0;white-space:pre-line;border:1px solid #d6b78c;border-radius:1.4cqw;background:linear-gradient(120deg,#fff4dc,#f7e6c6);box-shadow:inset 0 0 0 2px #fff8e885,0 .25cqw .65cqw #69402126;color:#78482d;text-shadow:none}
.hint::before,.hint::after{content:none}


/* Translucent parchment and mirrored scroll ornaments. */
.hint{padding:.55em 2.35em .6em;border-color:rgba(210,173,123,.5);background:linear-gradient(120deg,rgba(255,244,220,.77),rgba(247,230,198,.65));box-shadow:inset 0 0 0 1px #fff8e845,0 .2cqw .6cqw #6940211c;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.hint::before,.hint::after{content:'';position:absolute;top:50%;width:1.25em;height:2.55em;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2036%2072%22%20fill%3D%22none%22%20stroke%3D%22%2385502c%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M28%205C8%206%206%2022%2017%2023c10%201%2010-12%203-11-5%200-5%206-1%206M28%2067C8%2066%206%2050%2017%2049c10-1%2010%2012%203%2011-5%200-5-6-1-6M24%2023c-2%208-14%206-14%2013s12%205%2014%2013M10%2036H4M27%2030l4%206-4%206-4-6z%22%2F%3E%3Cpath%20d%3D%22M7%2027c-6-1-5-10-2-12%204%204%205%208%202%2012M7%2045c-6%201-5%2010-2%2012%204-4%205-8%202-12%22%20fill%3D%22%2385502c%22%20stroke%3D%22none%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;opacity:.8;pointer-events:none}
.hint::before{left:.55em;transform:translateY(-50%)}
.hint::after{right:.55em;transform:translateY(-50%) scaleX(-1)}

<body>
  <main class="stage" aria-label="Игра «Лепим пирожки»" data-phase="loading">
    <img class="kitchen" src="fon.png" alt="Уютная кухня с двумя раскрытыми ладонями" draggable="false">
    <p class="hint" role="status" aria-live="polite">Готовим кухню…</p>
    <button class="restart" type="button" aria-label="Начать сначала" title="Начать сначала" disabled>↻</button>
    <button class="tray" type="button" aria-label="Противень ещё не заполнен" disabled>
      <img class="tray-image" src="tray-empty.png" alt="" draggable="false">
      <span class="pastries" aria-hidden="true"></span>
    </button>
    <button class="dough" type="button" aria-label="Переложить тесто на другую ладонь" disabled hidden>
      <img class="dough-layer current" src="dough-1.png" alt="Кусочек теста" draggable="false">
      <img class="dough-layer next" src="dough-1.png" alt="" aria-hidden="true" draggable="false">
    </button>
    <section class="oven-scene" hidden aria-hidden="true">
      <img class="oven-bg" src="oven-background.png" alt="" draggable="false">
      <div class="oven-glow" aria-hidden="true"></div>
      <div class="oven-tray" aria-hidden="true">
        <img class="tray-image" src="tray-empty.png" alt="" draggable="false">
        <span class="pastries oven-pastries"></span>
      </div>
      <div class="oven-door open" aria-hidden="true">
        <img class="door-front" src="oven-door-front.png" alt="" draggable="false">
        <img class="door-inner" src="oven-door-inner.png" alt="" draggable="false">
      </div>
    </section>
    <section class="finish" role="dialog" aria-modal="true" aria-labelledby="finish-title" hidden>
      <div class="finish-card">
        <span class="finish-flower" aria-hidden="true">✿</span>
        <h1 id="finish-title">Пирожки готовы!</h1>
        <p>Какие румяные получились!</p>
        <button class="again" type="button">Ещё раз</button>
      </div>
    </section>
    <section class="error" role="alert" hidden>
      <p>Не получилось загрузить картинки.<br>Проверьте подключение и попробуйте ещё раз.</p>
      <button class="retry" type="button">Повторить</button>
    </section>
  </main>
  <script>
(() => {
  'use strict';
  const stage = document.querySelector('.stage');
  const dough = document.querySelector('.dough');
  const current = dough.querySelector('.current');
  const next = dough.querySelector('.next');
  const tray = document.querySelector('.tray');
  const pastries = document.querySelector('.pastries');
  const hint = document.querySelector('.hint');
  const finish = document.querySelector('.finish');
  const again = document.querySelector('.again');
  const restart = document.querySelector('.restart');
  const error = document.querySelector('.error');
  const kitchen = document.querySelector('.kitchen');
  const ovenScene = document.querySelector('.oven-scene');
  const ovenTray = document.querySelector('.oven-tray');
  const ovenPastries = document.querySelector('.oven-pastries');
  const ovenDoor = document.querySelector('.oven-door');
  const ovenGlow = document.querySelector('.oven-glow');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const hands = [{ x: 28.7, y: 68 }, { x: 65.3, y: 68 }];
  const slots = [
    { x: 27, y: 42 }, { x: 50, y: 42 }, { x: 73, y: 42 },
    { x: 27, y: 61 }, { x: 50, y: 61 }, { x: 73, y: 61 }
  ];
  let phase = 'loading';
  let frame = 1;
  let hand = 0;
  let count = 0;
  let run = 0;
  let position = hands[0];
  const activeAnimations = new Set();
  const src = n => `dough-${n}.png`;
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  function setPhase(value) {
    phase = value; stage.dataset.phase = value;
    hint.hidden = count > 0 && ['shaping', 'flying', 'settling', 'placing'].includes(value);
  }
  function place(point) {
    position = point;
    dough.style.left = `${point.x}%`;
    dough.style.top = `${point.y}%`;
  }
  async function animate(element, keys, duration) {
    const animation = element.animate(keys, {
      duration: reducedMotion.matches ? Math.min(duration, 160) : duration,
      easing: 'ease-in-out', fill: 'none'
    });
    activeAnimations.add(animation);
    try { await animation.finished; } catch { /* Reset cancels the old run. */ }
    finally { activeAnimations.delete(animation); }
  }
  function cancelAnimations() {
    activeAnimations.forEach(animation => animation.cancel());
    activeAnimations.clear();
  }
  function showFirstDough() {
    frame = 1; hand = 0;
    current.src = src(1); current.style.opacity = '1';
    next.src = src(1); next.style.opacity = '0';
    dough.style.width = '23%';
    dough.hidden = false; dough.disabled = false;
    place(hands[0]); setPhase('shaping');
    hint.textContent = 'Нажимай на тесто\nи проговаривай слоги';
  }
  function reset() {
    run++; cancelAnimations(); count = 0;
    pastries.replaceChildren(); finish.hidden = true;
    tray.disabled = true; tray.classList.remove('ready');
    tray.setAttribute('aria-label', 'Противень ещё не заполнен');
    kitchen.hidden = false; tray.hidden = false;
    ovenScene.hidden = true; ovenScene.setAttribute('aria-hidden','true');
    ovenPastries.replaceChildren();
    ovenTray.style.opacity = '0'; ovenTray.style.transform = 'translate(-50%,-50%)'; ovenTray.style.top = '74%';
    ovenDoor.classList.add('open'); ovenGlow.classList.remove('baking');
    restart.disabled = false; showFirstDough();
  }
  async function shape() {
    if (phase !== 'shaping' || dough.disabled) return;
    const token = run;
    setPhase('flying'); dough.disabled = true;
    const from = position;
    const target = hands[1 - hand];
    next.src = src(frame + 1);
    const arc = reducedMotion.matches ? from.y : from.y - 20;
    await Promise.all([
      animate(dough, [
        { left: `${from.x}%`, top: `${from.y}%`, offset: 0 },
        { left: `${(from.x + target.x) / 2}%`, top: `${arc}%`, offset: .5 },
        { left: `${target.x}%`, top: `${target.y}%`, offset: 1 }
      ], 780),
      animate(current, [{ opacity: 1 }, { opacity: 0 }], 780),
      animate(next, [{ opacity: 0 }, { opacity: 1 }], 780)
    ]);
    if (token !== run) return;
    hand = 1 - hand; frame++; place(target);
    current.src = src(frame);
    if (frame === 5) {
      setPhase('settling');
      await animate(dough, [{ opacity: 1 }, { opacity: 1 }], 360);
      if (token === run) await moveToTray(token);
    } else {
      setPhase('shaping'); dough.disabled = false;
    }
  }
  async function moveToTray(token) {
    setPhase('placing');
    const slot = slots[count];
    const bounds = stage.getBoundingClientRect();
    const trayBounds = tray.getBoundingClientRect();
    const target = {
      x: ((trayBounds.left - bounds.left) + trayBounds.width * slot.x / 100) / bounds.width * 100,
      y: ((trayBounds.top - bounds.top) + trayBounds.height * slot.y / 100) / bounds.height * 100
    };
    const smallWidth = trayBounds.width * .26 / bounds.width * 100;
    await animate(dough, [
      { left: `${position.x}%`, top: `${position.y}%`, width: '23%', offset: 0 },
      { left: `${(position.x + target.x) / 2}%`, top: `${Math.min(position.y, target.y) - 12}%`, width: '16%', offset: .5 },
      { left: `${target.x}%`, top: `${target.y}%`, width: `${smallWidth}%`, offset: 1 }
    ], 1000);
    if (token !== run) return;
    const pastry = new Image();
    pastry.src = src(5); pastry.alt = ''; pastry.className = 'pastry';
    pastry.style.left = `${slot.x}%`; pastry.style.top = `${slot.y}%`;
    pastries.append(pastry); count++;
    dough.hidden = true;
    if (count === 6) {
      setPhase('tray-ready'); tray.disabled = false; tray.classList.add('ready');
      tray.setAttribute('aria-label', 'Все шесть пирожков слеплены. Нажми на противень');
      hint.textContent = 'Нажми на противень';
      if (document.activeElement === dough) tray.focus({ preventScroll: true });
    } else {
      showFirstDough();
    }
  }

  async function bakePies() {
    if (phase !== 'tray-ready') return;
    const token = run;
    setPhase('oven');
    tray.disabled = true; tray.classList.remove('ready'); dough.hidden = true;
    hint.textContent = 'Отправляем пирожки в духовку';

    kitchen.hidden = true; tray.hidden = true;
    ovenScene.hidden = false; ovenScene.setAttribute('aria-hidden','false');
    ovenPastries.replaceChildren();

    slots.forEach(slot => {
      const pie = new Image();
      pie.src = src(5); pie.alt = ''; pie.className = 'pastry';
      pie.style.left = `${slot.x}%`; pie.style.top = `${slot.y}%`;
      ovenPastries.append(pie);
    });

    ovenDoor.classList.add('open');
    ovenTray.style.opacity = '1';
    ovenTray.style.transform = 'translate(-50%,-50%)'; ovenTray.style.top = '74%';
    await wait(450); if (token !== run) return;

    await animate(ovenTray, [
      {top:'74%',transform:'translate(-50%,-50%) scale(1)',opacity:1},
      {top:'61%',transform:'translate(-50%,-50%) scale(.76)',opacity:1}
    ],1250);
    if (token !== run) return;
    ovenTray.style.top='61%'; ovenTray.style.transform='translate(-50%,-50%) scale(.76)';

    hint.textContent='Пирожки пекутся…';
    ovenDoor.classList.remove('open');
    await wait(reducedMotion.matches ? 180 : 950); if (token !== run) return;

    ovenGlow.classList.add('baking');
    await wait(4000); if (token !== run) return;
    ovenGlow.classList.remove('baking');

    ovenPastries.querySelectorAll('.pastry').forEach(pie => pie.src='pie-baked.png');

    ovenDoor.classList.add('open');
    await wait(reducedMotion.matches ? 180 : 950); if (token !== run) return;

    hint.textContent='Пирожки готовы!';
    await animate(ovenTray, [
      {top:'61%',transform:'translate(-50%,-50%) scale(.76)',opacity:1},
      {top:'74%',transform:'translate(-50%,-50%) scale(1)',opacity:1}
    ],1300);
    if (token !== run) return;
    ovenTray.style.top='74%'; ovenTray.style.transform='translate(-50%,-50%) scale(1)';

    await wait(500); if (token !== run) return;
    setPhase('complete'); finish.hidden=false; restart.disabled=true;
    again.focus({preventScroll:true});
  }

  async function load() {
    setPhase('loading'); error.hidden = true; restart.disabled = true;
    hint.textContent = 'Готовим кухню…';
    try {
      await Promise.all(['fon.png', 'tray-empty.png', ...[1, 2, 3, 4, 5].map(src), 'oven-background.png', 'oven-door-front.png', 'oven-door-inner.png', 'pie-baked.png'].map(path =>
        new Promise((resolve, reject) => {
          const image = new Image(); image.onload = resolve; image.onerror = reject; image.src = path;
        })
      ));
      reset();
    } catch {
      setPhase('error'); error.hidden = false; hint.textContent = 'Картинки не загрузились';
    }
  }
  dough.addEventListener('click', shape);
  tray.addEventListener('click', bakePies);
  again.addEventListener('click', () => { reset(); dough.focus({ preventScroll: true }); });
  restart.addEventListener('click', reset);
  document.querySelector('.retry').addEventListener('click', load);
  finish.addEventListener('keydown', event => {
    if (event.key === 'Tab') { event.preventDefault(); again.focus(); }
  });
  load();
})();

</script>
